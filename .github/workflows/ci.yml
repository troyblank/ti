# Lints, type-checks and tests every pull request (and every push to main).
# Tests mock Ollama, so no model or container is needed here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint and type-check
        run: yarn lint

      - name: Test (100% coverage required)
        run: yarn test
